name: Docker Build Push and ECS Deploy

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: rag-app-cluster

  STREAMLIT_ECR: rag-app-streamlit
  FASTAPI_ECR: rag-app-fastapi

  STREAMLIT_SERVICE: rag-app-streamlit
  FASTAPI_SERVICE: rag-app-fastapi

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Streamlit
        run: |
          docker build \
            -f Dockerfile.streamlit \
            -t ${{ steps.ecr.outputs.registry }}/${{ env.STREAMLIT_ECR }}:${{ github.sha }} .

          docker push \
            ${{ steps.ecr.outputs.registry }}/${{ env.STREAMLIT_ECR }}:${{ github.sha }}

      - name: Build and Push FastAPI
        run: |
          docker build \
            -f Dockerfile.fastapi \
            -t ${{ steps.ecr.outputs.registry }}/${{ env.FASTAPI_ECR }}:${{ github.sha }} .

          docker push \
            ${{ steps.ecr.outputs.registry }}/${{ env.FASTAPI_ECR }}:${{ github.sha }}

      - name: Get Streamlit Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition rag-app-streamlit \
            --query taskDefinition \
            --output json > streamlit.json

      - name: Update Streamlit Image
        id: streamlit
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: streamlit.json
          container-name: streamlit
          image: ${{ steps.ecr.outputs.registry }}/${{ env.STREAMLIT_ECR }}:${{ github.sha }}

      - name: Deploy Streamlit
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.streamlit.outputs.task-definition }}
          service: ${{ env.STREAMLIT_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}

      - name: Get FastAPI Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition rag-app-fastapi \
            --query taskDefinition \
            --output json > fastapi.json

      - name: Update FastAPI Image
        id: fastapi
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: fastapi.json
          container-name: fastapi
          image: ${{ steps.ecr.outputs.registry }}/${{ env.FASTAPI_ECR }}:${{ github.sha }}

      - name: Deploy FastAPI
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.fastapi.outputs.task-definition }}
          service: ${{ env.FASTAPI_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}