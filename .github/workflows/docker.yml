name: Docker Build Push and ECS Deploy

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1

  STREAMLIT_ECR_REPOSITORY: rag-app-streamlit
  FASTAPI_ECR_REPOSITORY: rag-app-fastapi

  ECS_CLUSTER: rag-app-cluster

  STREAMLIT_ECS_SERVICE: streamlit-service
  FASTAPI_ECS_SERVICE: fastapi-service

  STREAMLIT_CONTAINER_NAME: streamlit-container
  FASTAPI_CONTAINER_NAME: fastapi-container

  STREAMLIT_TASK_FAMILY: rag-app-streamlit
  FASTAPI_TASK_FAMILY: rag-app-fastapi

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: AWS Login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: AWS ECR Login
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Check Streamlit ECR repository
        run: |
          aws ecr describe-repositories \
            --repository-names ${{ env.STREAMLIT_ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }}

      - name: Check FastAPI ECR repository
        run: |
          aws ecr describe-repositories \
            --repository-names ${{ env.FASTAPI_ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }}

      - name: Build Streamlit image
        run: |
          docker build \
            -t ${{ steps.ecr-login.outputs.registry }}/${{ env.STREAMLIT_ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            -f Dockerfile.streamlit .

      - name: Push Streamlit image
        run: |
          docker push \
            ${{ steps.ecr-login.outputs.registry }}/${{ env.STREAMLIT_ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Build FastAPI image
        run: |
          docker build \
            -t ${{ steps.ecr-login.outputs.registry }}/${{ env.FASTAPI_ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            -f Dockerfile.fastapi .

      - name: Push FastAPI image
        run: |
          docker push \
            ${{ steps.ecr-login.outputs.registry }}/${{ env.FASTAPI_ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Get ECS task execution role
        id: execution-role
        run: |
          ROLE_ARN=$(aws iam get-role \
            --role-name ecsTaskExecutionRole \
            --query 'Role.Arn' \
            --output text)

          echo "ROLE_ARN=$ROLE_ARN" >> $GITHUB_ENV

      - name: Create Streamlit task definition
        run: |
          cat > streamlit-task.json <<EOF
          {
            "family": "${{ env.STREAMLIT_TASK_FAMILY }}",
            "networkMode": "awsvpc",
            "requiresCompatibilities": [
              "FARGATE"
            ],
            "cpu": "256",
            "memory": "512",
            "executionRoleArn": "${{ env.ROLE_ARN }}",
            "containerDefinitions": [
              {
                "name": "${{ env.STREAMLIT_CONTAINER_NAME }}",
                "image": "${{ steps.ecr-login.outputs.registry }}/${{ env.STREAMLIT_ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}",
                "essential": true,
                "portMappings": [
                  {
                    "containerPort": 8501,
                    "hostPort": 8501,
                    "protocol": "tcp"
                  }
                ],
                "command": [
                  "streamlit",
                  "run",
                  "frontend/streamlit_app.py",
                  "--server.address=0.0.0.0",
                  "--server.port=8501"
                ],
                "environment": [
                  {
                    "name": "BACKEND_URL",
                    "value": "/backend"
                  }
                ]
              }
            ]
          }
          EOF

      - name: Register Streamlit task definition
        id: streamlit-register
        run: |
          STREAMLIT_TASK_DEFINITION=$(aws ecs register-task-definition \
            --cli-input-json file://streamlit-task.json \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "STREAMLIT_TASK_DEFINITION=$STREAMLIT_TASK_DEFINITION" >> $GITHUB_ENV

      - name: Create FastAPI task definition
        run: |
          cat > fastapi-task.json <<EOF
          {
            "family": "${{ env.FASTAPI_TASK_FAMILY }}",
            "networkMode": "awsvpc",
            "requiresCompatibilities": [
              "FARGATE"
            ],
            "cpu": "512",
            "memory": "1024",
            "executionRoleArn": "${{ env.ROLE_ARN }}",
            "containerDefinitions": [
              {
                "name": "${{ env.FASTAPI_CONTAINER_NAME }}",
                "image": "${{ steps.ecr-login.outputs.registry }}/${{ env.FASTAPI_ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}",
                "essential": true,
                "portMappings": [
                  {
                    "containerPort": 8000,
                    "hostPort": 8000,
                    "protocol": "tcp"
                  }
                ],
                "command": [
                  "uvicorn",
                  "main:app",
                  "--host",
                  "0.0.0.0",
                  "--port",
                  "8000"
                ],
                "environment": [
                  {
                    "name": "DATABASE_URL",
                    "value": "${{ secrets.NEON_DATABASE_URL }}"
                  },
                  {
                    "name": "POSTGRES_DB",
                    "value": "${{ secrets.NEON_DATABASE_NAME }}"
                  },
                  {
                    "name": "POSTGRES_USER",
                    "value": "${{ secrets.NEON_DATABASE_USER }}"
                  },
                  {
                    "name": "POSTGRES_PASSWORD",
                    "value": "${{ secrets.NEON_DATABASE_PASSWORD }}"
                  },
                  {
                    "name": "PORT",
                    "value": "8000"
                  }
                ],
                "healthCheck": {
                  "command": [
                    "CMD-SHELL",
                    "curl -f http://localhost:8000/health || exit 1"
                  ],
                  "interval": 30,
                  "timeout": 5,
                  "retries": 3,
                  "startPeriod": 60
                }
              }
            ]
          }
          EOF

      - name: Register FastAPI task definition
        id: fastapi-register
        run: |
          FASTAPI_TASK_DEFINITION=$(aws ecs register-task-definition \
            --cli-input-json file://fastapi-task.json \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "FASTAPI_TASK_DEFINITION=$FASTAPI_TASK_DEFINITION" >> $GITHUB_ENV

      - name: Deploy Streamlit service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.STREAMLIT_ECS_SERVICE }} \
            --task-definition ${{ env.STREAMLIT_TASK_DEFINITION }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Deploy FastAPI service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.FASTAPI_ECS_SERVICE }} \
            --task-definition ${{ env.FASTAPI_TASK_FAMILY }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for Streamlit service
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.STREAMLIT_ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}

      - name: Wait for FastAPI service
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.FASTAPI_ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}

      - name: Show deployed images
        run: |
          echo "Streamlit:"
          echo "${{ steps.ecr-login.outputs.registry }}/${{ env.STREAMLIT_ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          echo "FastAPI:"
          echo "${{ steps.ecr-login.outputs.registry }}/${{ env.FASTAPI_ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
