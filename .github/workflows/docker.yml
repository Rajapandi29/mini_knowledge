name: First Docker Build and ECR Push

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

  STREAMLIT_ECR_REPOSITORY: rag-app-streamlit
  FASTAPI_ECR_REPOSITORY: rag-app-fastapi

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: AWS Login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: AWS ECR Login
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Check Streamlit ECR repository
        run: |
          aws ecr describe-repositories \
            --repository-names ${{ env.STREAMLIT_ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }}

      - name: Check FastAPI ECR repository
        run: |
          aws ecr describe-repositories \
            --repository-names ${{ env.FASTAPI_ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }}

      - name: Build Streamlit image
        run: |
          docker build \
            -t ${{ steps.ecr-login.outputs.registry }}/${{ env.STREAMLIT_ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            -f Dockerfile.streamlit .

      - name: Push Streamlit image
        run: |
          docker push \
            ${{ steps.ecr-login.outputs.registry }}/${{ env.STREAMLIT_ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Build FastAPI image
        run: |
          docker build \
            -t ${{ steps.ecr-login.outputs.registry }}/${{ env.FASTAPI_ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            -f Dockerfile.fastapi .

      - name: Push FastAPI image
        run: |
          docker push \
            ${{ steps.ecr-login.outputs.registry }}/${{ env.FASTAPI_ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Show pushed images
        run: |
          echo "Streamlit image:"
          echo "${{ steps.ecr-login.outputs.registry }}/${{ env.STREAMLIT_ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          echo "FastAPI image:"
          echo "${{ steps.ecr-login.outputs.registry }}/${{ env.FASTAPI_ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"

